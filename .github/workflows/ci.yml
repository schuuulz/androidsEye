# Verifica cada Pull Request nos três sistemas antes do merge:
# build do frontend (TypeScript + Vite), clippy sem avisos e testes do backend.
#
# Os nomes dos jobs ("Testes (...)") são exigidos pela proteção da main —
# ao renomeá-los, atualize também o ruleset do repositório.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR cancela a verificação anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # O código tem trechos específicos de cada sistema (#[cfg(windows)], #[cfg(unix)]).
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Bibliotecas do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Também gera o dist/, que o Rust embute no binário em tempo de compilação.
      - name: Frontend (TypeScript + build)
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testes do backend
        working-directory: src-tauri
        run: cargo test --locked
